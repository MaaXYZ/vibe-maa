name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.12"]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true
      - run: uv sync --locked --python ${{ matrix.python }}
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest tests integration/targets/drawio/test_prepare.py integration/agent/test_harness.py
      - run: uv build
      - name: Exercise installed wheel outside the source project
        shell: bash
        run: uv run --isolated --no-project --with dist/*.whl python integration/package_smoke.py
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: distributions-${{ matrix.os }}-py${{ matrix.python }}
          path: dist/*
          if-no-files-found: error

  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true
      - run: uv sync --locked --extra browser
      - run: uv run playwright install --with-deps chromium
      - run: uv run pytest -m browser
