[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "vibe-maa"
version = "0.1.0"
description = "Evidence-driven MaaFramework development tools for coding agents"
readme = "README.md"
requires-python = ">=3.11"
license = "AGPL-3.0-only"
dependencies = ["maafw>=5.16,<6", "numpy>=1.26", "Pillow>=10", "json5>=0.12"]

[project.scripts]
vibe-maa = "vibe_maa.cli:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.11"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
